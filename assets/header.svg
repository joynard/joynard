<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">

      <!-- Stop 0%: dark cycle, phase 0 -->
      <stop offset="0%">
        <animate attributeName="stop-color" calcMode="spline"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          values="#1a0a00;#3d1f00;#704214;#A0522D;#C68642;#A0522D;#704214;#3d1f00;#1a0a00"
          dur="18s" repeatCount="indefinite"/>
      </stop>

      <!-- Stop 25%: phase shifted +2 steps -->
      <stop offset="25%">
        <animate attributeName="stop-color" calcMode="spline"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          values="#704214;#A0522D;#C68642;#A0522D;#704214;#3d1f00;#1a0a00;#3d1f00;#704214"
          dur="18s" repeatCount="indefinite"/>
      </stop>

      <!-- Stop 50%: phase shifted +4 steps (opposite peak) -->
      <stop offset="50%">
        <animate attributeName="stop-color" calcMode="spline"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          values="#C68642;#A0522D;#704214;#3d1f00;#1a0a00;#3d1f00;#704214;#A0522D;#C68642"
          dur="18s" repeatCount="indefinite"/>
      </stop>

      <!-- Stop 75%: phase shifted +6 steps -->
      <stop offset="75%">
        <animate attributeName="stop-color" calcMode="spline"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          values="#704214;#3d1f00;#1a0a00;#3d1f00;#704214;#A0522D;#C68642;#A0522D;#704214"
          dur="18s" repeatCount="indefinite"/>
      </stop>

      <!-- Stop 100%: same phase as 0% for seamless edge -->
      <stop offset="100%">
        <animate attributeName="stop-color" calcMode="spline"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          values="#1a0a00;#3d1f00;#704214;#A0522D;#C68642;#A0522D;#704214;#3d1f00;#1a0a00"
          dur="18s" repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.32)"/>
    </radialGradient>
  </defs>

  <!-- Banner background (first 250 units only) -->
  <rect width="1200" height="250" fill="url(#bg)"/>
  <rect width="1200" height="250" fill="url(#vignette)"/>

  <!-- Wave at the bottom of the banner -->
  <path d="M0,195 Q200,225 400,200 Q600,175 800,205 Q1000,235 1200,200 L1200,250 L0,250 Z"
        fill="rgba(0,0,0,0.18)"/>

  <!-- Shimmer line above wave -->
  <path d="M0,195 Q200,225 400,200 Q600,175 800,205 Q1000,235 1200,200"
        fill="none" stroke="rgba(245,245,220,0.12)" stroke-width="1.5"/>

  <!-- Name text -->
  <text x="600" y="128"
        text-anchor="middle"
        font-family="'Trebuchet MS','Gill Sans',sans-serif"
        font-size="52"
        font-weight="normal"
        fill="#F5F5DC"
        letter-spacing="2"
        opacity="0.97">Alexander Fabiano Joynard Lapod</text>

  <!-- Transparent spacer: y=250 to y=285 (35px natural spacing below banner) -->
</svg>
