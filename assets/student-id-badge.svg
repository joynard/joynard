<svg xmlns="http://www.w3.org/2000/svg" width="140" height="28">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color"
          values="#a78bfa;#60a5fa;#34d399;#f9a8d4;#fbbf24;#f87171;#818cf8;#a78bfa"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color"
          values="#60a5fa;#34d399;#f9a8d4;#fbbf24;#f87171;#818cf8;#a78bfa;#60a5fa"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color"
          values="#34d399;#f9a8d4;#fbbf24;#f87171;#818cf8;#a78bfa;#60a5fa;#34d399"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="r">
      <rect width="140" height="28" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background gradient -->
  <rect width="140" height="28" rx="4" fill="url(#grad)" clip-path="url(#r)"/>

  <!-- Icon section (dark overlay for icon bg) -->
  <rect width="30" height="28" fill="rgba(0,0,0,0.18)" clip-path="url(#r)"/>

  <!-- Card / ID icon -->
  <text x="15" y="19" text-anchor="middle" font-size="13" fill="white">🪪</text>

  <!-- Divider line -->
  <rect x="30" y="4" width="1" height="20" fill="rgba(255,255,255,0.35)"/>

  <!-- Label text -->
  <text x="85" y="18.5" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="600" fill="white"
        letter-spacing="0.5">STUDENT ID</text>
</svg>
