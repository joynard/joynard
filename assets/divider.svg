      <stop offset="0%" stop-color="#C68642" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C68642" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="fadeRight" gradientUnits="userSpaceOnUse" x1="666" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#C68642" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C68642" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="11" x2="534" y2="11" stroke="url(#fadeLeft)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="666" y1="11" x2="1200" y2="11" stroke="url(#fadeRight)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <path d="M600 5.4 L605.6 11 L600 16.6 L594.4 11 Z" fill="#C68642" fill-opacity="0.55"/>
