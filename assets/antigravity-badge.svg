<svg xmlns="http://www.w3.org/2000/svg" width="170" height="28">
  <defs>
    <clipPath id="r">
      <rect width="170" height="28" rx="4"/>
    </clipPath>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="170" height="28" rx="4" fill="url(#g)" clip-path="url(#r)"/>
  <rect width="30" height="28" fill="rgba(0,0,0,0.18)" clip-path="url(#r)"/>
  <g transform="translate(7, 6) scale(0.666)" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bottom Left Leg -->
    <path d="M5 21 L9 13" />
    <!-- Bottom Right Leg -->
    <path d="M19 21 L15 13" />
    <!-- Floating Crossbar -->
    <path d="M10 17 H14" opacity="0.8" />
    <!-- Levitating Top Apex (Floating Chevron) -->
    <path d="M9 9 L12 4 L15 9" />
  </g>
  <rect x="30" y="4" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
  <text x="100" y="18.5" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="700" fill="white"
        letter-spacing="0.5">ANTIGRAVITY AGENT</text>
</svg>
